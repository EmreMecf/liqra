# Liqra — Codemagic CI yapılandırması
#
# ── Neden bu dosya var ────────────────────────────────────────────────────────
# iOS derlemesi macOS gerektirir. Geliştirme makinesi Windows olduğu için
# iOS tarafı bulutta derlenir. Codemagic, App Store Connect API anahtarıyla
# sertifikayı ve provisioning profile'ı **kendisi üretir** — Mac gerekmez.
#
# ── Gizli dosyalar ────────────────────────────────────────────────────────────
# google-services.json, GoogleService-Info.plist ve imzalama anahtarı
# .gitignore'da; depoya girmezler. Codemagic'te şifreli ortam değişkeni olarak
# tutulur ve derleme sırasında dosyaya yazılır (aşağıdaki scriptler).
#
# Base64'e çevirmek için (Windows PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("google-services.json")) | Set-Clipboard

definitions:
  flutter_version: &flutter_version 3.44.6

  # Codemagic önbellek yolunu "cache:" bloğunun içinde bekler. Doğrudan
  # workflow altına "cache_paths" konursa yapılandırma doğrulaması
  # "extra fields not permitted" hatasıyla reddeder.
  cache_config: &cache_config
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache

  # Her derlemeden önce çalışan ortak adımlar
  prepare_android: &prepare_android
    name: Firebase yapılandırmasını yaz (Android)
    script: |
      if [ -z "$GOOGLE_SERVICES_JSON" ]; then
        echo "HATA: GOOGLE_SERVICES_JSON ortam degiskeni tanimli degil."
        echo "Codemagic > Environment variables icine base64 olarak ekleyin."
        exit 1
      fi
      echo "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 --decode \
        > android/app/google-services.json 2>/dev/null

      if [ ! -s android/app/google-services.json ]; then
        echo "HATA: GOOGLE_SERVICES_JSON base64 olarak cozulemedi."
        echo "Degisken uzunlugu: ${#GOOGLE_SERVICES_JSON} karakter (beklenen: 4096)"
        exit 1
      fi
      echo "google-services.json yazildi ($(wc -c < android/app/google-services.json) bayt)."

  prepare_ios: &prepare_ios
    name: Firebase yapılandırmasını yaz (iOS)
    script: |
      if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
        echo "HATA: GOOGLE_SERVICE_INFO_PLIST ortam degiskeni tanimli degil."
        exit 1
      fi
      # tr -d: panodan yapistirilirken araya giren satir sonu ve bosluklar
      # base64 cozumunu bozar; once temizliyoruz.
      echo "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '[:space:]' | base64 --decode \
        > ios/Runner/GoogleService-Info.plist 2>/dev/null

      # Cozum basarisiz olsa bile onceki surumde "yazildi" yazip devam
      # ediliyordu; asil hata iki adim sonra ortaya cikiyordu. Burada duruyoruz.
      if [ ! -s ios/Runner/GoogleService-Info.plist ]; then
        echo "HATA: GOOGLE_SERVICE_INFO_PLIST base64 olarak cozulemedi."
        echo "Degisken uzunlugu: ${#GOOGLE_SERVICE_INFO_PLIST} karakter (beklenen: 1656)"
        echo "Deger kirpilmis ya da base64 disi karakter icermis olabilir."
        exit 1
      fi
      echo "GoogleService-Info.plist yazildi ($(wc -c < ios/Runner/GoogleService-Info.plist) bayt)."

      # Google girisi icin URL semasi: REVERSED_CLIENT_ID plist'ten okunup
      # Info.plist'teki yer tutucunun yerine yazilir. Elle senkron tutmak
      # yerine her derlemede otomatik alinir.
      REVERSED=$(plutil -extract REVERSED_CLIENT_ID raw ios/Runner/GoogleService-Info.plist 2>/dev/null)
      if [ -z "$REVERSED" ]; then
        echo "HATA: REVERSED_CLIENT_ID okunamadi - plist bozuk."
        exit 1
      fi
      sed -i '' "s|REVERSED_CLIENT_ID_YER_TUTUCU|$REVERSED|g" ios/Runner/Info.plist
      echo "URL semasi ayarlandi: $REVERSED"

  quality_gate: &quality_gate
    name: Kod kalitesi — analyze + test
    script: |
      flutter pub get
      dart run build_runner build --delete-conflicting-outputs
      flutter analyze
      flutter test

workflows:
  # ══════════════════════════════════════════════════════════════════════════
  # ANDROID — Google Play
  # ══════════════════════════════════════════════════════════════════════════
  android-release:
    name: Liqra · Android (Play Store)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - firebase          # GOOGLE_SERVICES_JSON
        - google_play       # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      android_signing:
        - liqra_keystore    # Codemagic'e yuklenen imzalama anahtari
      vars:
        PACKAGE_NAME: com.emrec.muhasebe

    <<: *cache_config

    scripts:
      - *prepare_android
      - name: İmzalama anahtarını doğrula
        script: |
          # Codemagic, android_signing altinda tanimli anahtardan
          # android/key.properties dosyasini KENDISI uretir. Uretemezse
          # (grup adi yanlis, anahtar silinmis, yapilandirma kaymis)
          # build.gradle.kts release yapisini DEBUG anahtariyla imzalar ve
          # yalnizca bir uyari yazar. O .aab Play'e yuklenir, dakikalar
          # sonra "debug sertifikasiyla imzalanmis" diye reddedilir.
          # Hatayi burada, derlemeye baslamadan gorelim.
          if [ ! -s android/key.properties ]; then
            echo "HATA: android/key.properties olusturulmadi."
            echo "Codemagic > Code signing identities > Android keystore"
            echo "altinda 'liqra_keystore' referans adiyla bir anahtar"
            echo "bulundugundan emin olun."
            exit 1
          fi
          echo "Imzalama anahtari hazir."
      - *quality_gate
      - name: Sürüm numarasını Play'deki son yapıdan bir artır
        script: |
          # Ayni versionCode ile ikinci yukleme reddedilir. Play'deki en
          # yuksek numarayi alip uzerine ekliyoruz; elle takip gerekmez.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          echo "Play'deki son build number: $LATEST"
          echo "BUILD_NUMBER=$(($LATEST + 1))" >> $CM_ENV
      - name: App Bundle derle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - emreciftci873@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Once ic test kanalina — dogrudan produksiyona gonderme.
        track: internal
        submit_as_draft: true

  # ══════════════════════════════════════════════════════════════════════════
  # iOS — App Store  (Mac GEREKMEZ, sertifika Codemagic tarafindan uretilir)
  # ══════════════════════════════════════════════════════════════════════════
  ios-release:
    name: Liqra · iOS (App Store)
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: liqra_asc_key   # App Store Connect API anahtari

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - firebase          # GOOGLE_SERVICE_INFO_PLIST
      # Elle imzalama. Otomatik imzalama (distribution_type + bundle_identifier)
      # denendi ancak Codemagic hesapta sertifika üretemedi ve her derleme
      # "No matching profiles found" ile durdu. Sertifika ve profil Apple
      # portalında elle oluşturulup Codemagic > Code signing identities
      # altına yüklendi; aşağıdaki adlar oradaki referans adlarıdır.
      ios_signing:
        certificates:
          - liqra_distribution
        provisioning_profiles:
          - liqra_app_store

    <<: *cache_config

    scripts:
      - *prepare_ios
      - *quality_gate
      - name: CocoaPods bağımlılıkları
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: İmzalama profilini Xcode projesine uygula
        script: |
          # Yuklenen provisioning profile'i Xcode projesine baglar ve
          # /Users/builder/export_options.plist dosyasini uretir.
          # Otomatik imzalamada Codemagic bunu kendisi yapiyordu; elle
          # imzalamaya gecince adim acikta kaldi ve "IPA derle" asamasi
          # "export_options.plist property list does not exist" ile dustu.
          # Pod kurulumundan SONRA calismali, workspace'i de duzenliyor.
          xcode-project use-profiles
      - name: Sürüm numarasını TestFlight'taki son yapıdan bir artır
        script: |
          # APP_STORE_APPLE_ID: App Store Connect'teki sayisal uygulama
          # kimligi (Uygulama Bilgileri > Genel > Apple ID).
          # Tanimsiz birakilirsa komut bos argumanla calisip hata verir,
          # build number her derlemede 1 olur ve ikinci yukleme
          # "bundle version must be higher" ile reddedilir. Sessizce
          # ilerlemek yerine burada durduruyoruz.
          if [ -z "$APP_STORE_APPLE_ID" ]; then
            echo "HATA: APP_STORE_APPLE_ID ortam degiskeni tanimli degil."
            echo "Codemagic > Environment variables icine uygulamanin"
            echo "App Store Connect sayisal Apple ID degerini ekleyin."
            exit 1
          fi
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          echo "TestFlight'taki son build number: $LATEST"
          echo "BUILD_NUMBER=$(($LATEST + 1))" >> $CM_ENV
      - name: IPA derle
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - emreciftci873@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # TestFlight'a yukle; App Store incelemesine ELLE gonderilecek.
        submit_to_testflight: true
        submit_to_app_store: false

        # Yapiyi hangi test grubuna dagitacagi.
        #
        # ONEMLI: Bu satirlar olmadan yapi App Store Connect'e yuklenir,
        # "Ready to Test" olur ama HICBIR test grubuna atanmaz. TestFlight
        # uygulamasinda hicbir sey gorunmez -- disaridan "uygulama yok" ya da
        # "kullanilamiyor" gibi gorunur, ortada hata da yoktur.
        #
        # Buradaki ad App Store Connect > TestFlight altindaki grubun adiyla
        # BIREBIR ayni olmali; grup yoksa derleme yayin adiminda durur.
        # Grubu once olusturun: App Store Connect > TestFlight > Gruplar.
        beta_groups:
          - Liqra Test

  # ══════════════════════════════════════════════════════════════════════════
  # iOS — Ad Hoc  (kayitli cihaza dogrudan kurulum, TestFlight'siz)
  #
  # App Store yerine belirli cihazlara kurulum icindir. Profil yalnizca
  # UDID'si kayitli cihazlara izin verir; yeni bir telefon eklenecekse once
  # Apple portalinda cihaz kaydedilip profil yeniden uretilmelidir.
  #
  # Kalite kapisi bilerek yok: bu workflow cihazda hizli deneme icin var,
  # analyze ve testler ios-release ile quality-check'te zaten kosuluyor.
  # ══════════════════════════════════════════════════════════════════════════
  ios-adhoc:
    name: Liqra · iOS (Ad Hoc — cihaza kurulum)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - firebase          # GOOGLE_SERVICE_INFO_PLIST
      ios_signing:
        certificates:
          - liqra_distribution
        provisioning_profiles:
          - liqra_ad_hoc

    <<: *cache_config

    scripts:
      - *prepare_ios
      - name: CocoaPods bağımlılıkları
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: İmzalama profilini Xcode projesine uygula
        script: |
          # Profil ad hoc oldugu icin uretilen export_options.plist da
          # method=ad-hoc olur; ayrica belirtmeye gerek yok.
          xcode-project use-profiles
      - name: IPA derle (ad hoc)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - emreciftci873@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════
  # Her push'ta hizli kontrol — imzalama yok, sadece kalite kapisi
  # ══════════════════════════════════════════════════════════════════════════
  quality-check:
    name: Liqra · Kalite kontrolü
    max_build_duration: 20
    instance_type: linux_x2

    environment:
      flutter: *flutter_version

    <<: *cache_config

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *quality_gate

    publishing:
      email:
        recipients:
          - emreciftci873@gmail.com
        notify:
          success: false
          failure: true
